<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#0F2A43; --slate:#5C6E7E; --faint:#8A99A6;
    --line:#E4E8ED; --line2:#EEF1F4; --paper:#FFFFFF; --bg:#EEF2F5;
    --blue:#1E6FB8; --blue-d:#134E85; --orange:#E8821E;
    --good:#178A4E; --good-bg:#E6F4EC; --good-ln:#B7E0C6;
    --warn:#A9701A; --warn-bg:#FaF1DE; --warn-ln:#EAD3A0;
    --bad:#B23A2B;  --bad-bg:#FBEAE7;  --bad-ln:#EEC3BB;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.45;
    -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1;
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 20px 80px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Uploader ---------- */
  .tool{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:26px}
  .tool h1{font-size:19px; margin:0 0 3px; letter-spacing:-.01em}
  .tool p{margin:0 0 18px; color:var(--slate); font-size:13.5px}
  .drops{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:640px){.drops{grid-template-columns:1fr}}
  .drop{border:1.5px dashed var(--line); border-radius:11px; padding:20px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s; background:#FBFCFD}
  .drop:hover{border-color:var(--blue); background:#F5F9FD}
  .drop.set{border-style:solid; border-color:var(--good-ln); background:var(--good-bg)}
  .drop.err{border-style:solid; border-color:var(--bad-ln); background:var(--bad-bg)}
  .drop .tag{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--faint); text-transform:uppercase}
  .drop.set .tag{color:var(--good)}
  .drop .fn{font-size:13px; margin-top:7px; color:var(--slate); word-break:break-word}
  .drop .fn b{color:var(--ink)}
  .fields{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
  @media(max-width:640px){.fields{grid-template-columns:1fr}}
  .fields label{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--faint); text-transform:uppercase; display:block; margin-bottom:4px}
  .fields input{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink); font-family:inherit}
  .fields input:focus{outline:2px solid var(--blue); outline-offset:-1px; border-color:var(--blue)}
  .row-actions{display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap}
  .btn{border:0; border-radius:9px; padding:10px 18px; font-size:14px; font-weight:650; cursor:pointer; font-family:inherit}
  .btn-p{background:var(--blue); color:#fff}
  .btn-p:hover{background:var(--blue-d)}
  .btn-p:disabled{background:#B9C6D1; cursor:not-allowed}
  .btn-s{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .btn-s:hover{border-color:var(--slate)}
  .hint{font-size:12.5px; color:var(--slate)}
  .hint.bad{color:var(--bad)}

  /* ---------- Report ---------- */
  #report{display:none}
  .sheet{background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .rhead{padding:26px 30px 22px; border-bottom:2px solid var(--ink)}
  .brandrow{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:11px}
  .logo{height:46px;width:auto;flex:0 0 auto;display:block}
  .brand .bt{font-size:20px; font-weight:800; letter-spacing:-.02em}
  .brand .bt span{color:var(--orange)}
  .brand .bs{font-size:10.5px; font-weight:700; letter-spacing:.14em; color:var(--blue); text-transform:uppercase; margin-top:-2px}
  .co{font-size:12px; color:var(--slate); text-align:right; line-height:1.5}
  .rtitle{margin-top:20px}
  .rtitle .k{font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--orange); text-transform:uppercase}
  .rtitle h2{font-size:25px; margin:5px 0 6px; letter-spacing:-.02em; line-height:1.15}
  .rtitle .verify{font-size:13px; color:var(--slate); max-width:62ch}
  .metarow{display:flex; gap:26px; flex-wrap:wrap; margin-top:16px; padding-top:15px; border-top:1px solid var(--line2)}
  .meta .l{font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--faint); text-transform:uppercase}
  .meta .v{font-size:13.5px; font-weight:600; margin-top:1px}

  section{padding:24px 30px}
  section + section{border-top:1px solid var(--line2)}
  .sh{font-size:12px; font-weight:700; letter-spacing:.07em; color:var(--faint); text-transform:uppercase; margin:0 0 16px}

  /* hero */
  .hero{display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  @media(max-width:640px){.hero{grid-template-columns:1fr}}
  .hcell{padding:18px 20px; border-right:1px solid var(--line2)}
  .hcell:last-child{border-right:0}
  @media(max-width:640px){.hcell{border-right:0;border-bottom:1px solid var(--line2)}.hcell:last-child{border-bottom:0}}
  .hcell .hl{font-size:12px; font-weight:650; color:var(--slate)}
  .hcell .ba{font-size:12.5px; color:var(--faint); margin:8px 0 2px; font-variant-numeric:tabular-nums}
  .hcell .ba b{color:var(--ink); font-weight:700}
  .hbig{display:flex; align-items:baseline; gap:8px; margin-top:4px}
  .hbig .pct{font-size:30px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .hbig .ar{font-size:20px; font-weight:800}
  .g .pct,.g .ar{color:var(--good)} .w .pct,.w .ar{color:var(--warn)} .b .pct,.b .ar{color:var(--bad)}
  .verdict{margin-top:5px; font-size:12px; font-weight:650}
  .g .verdict{color:var(--good)} .w .verdict{color:var(--warn)} .b .verdict{color:var(--bad)}

  /* conditions / measurements two-col */
  .two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line); border-radius:11px; overflow:hidden}
  .panel .pt{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:8px 14px; color:#fff}
  .panel.before .pt{background:var(--slate)}
  .panel.after .pt{background:var(--blue)}
  .dl{padding:12px 14px}
  .dl div{display:flex; justify-content:space-between; gap:14px; padding:5px 0; font-size:13px; border-bottom:1px solid var(--line2)}
  .dl div:last-child{border-bottom:0}
  .dl .dk{color:var(--slate)} .dl .dv{font-weight:650; font-variant-numeric:tabular-nums}

  /* metric rails */
  .metric{padding:15px 0; border-bottom:1px solid var(--line2)}
  .metric:last-child{border-bottom:0}
  .mtop{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:11px}
  .mname{font-size:14.5px; font-weight:700}
  .mname .u{font-size:11.5px; font-weight:600; color:var(--faint); margin-left:6px}
  .mbadge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:750; padding:3px 10px; border-radius:20px; font-variant-numeric:tabular-nums; border:1px solid}
  .mbadge.g{color:var(--good); background:var(--good-bg); border-color:var(--good-ln)}
  .mbadge.w{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-ln)}
  .mbadge.b{color:var(--bad); background:var(--bad-bg); border-color:var(--bad-ln)}
  .bars{display:grid; grid-template-columns:52px 1fr 74px; gap:8px 12px; align-items:center}
  .bl{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--faint); text-transform:uppercase}
  .track{height:20px; background:var(--line2); border-radius:5px; overflow:hidden}
  .fill{height:100%; border-radius:5px; transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .fill.base{background:#B9C6D1}
  .fill.g{background:var(--good)} .fill.w{background:var(--warn)} .fill.b{background:var(--bad)}
  .bv{font-size:13px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
  .mnote{font-size:12px; color:var(--slate); margin-top:9px; padding-left:2px}

  .rfoot{padding:18px 30px 22px; border-top:2px solid var(--ink); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-end}
  .rfoot .fl{font-size:11.5px; color:var(--slate); max-width:60ch; line-height:1.5}
  .rfoot .prep{font-size:13px; font-weight:650}
  .rfoot .prep span{color:var(--slate); font-weight:500}

  .report-actions{display:flex; gap:10px; margin:20px 2px 0; flex-wrap:wrap}

  @media print{
    @page{ size: letter portrait; margin: 0.5in; }
    html,body{background:#fff}
    .wrap{max-width:none; padding:0}
    .tool,.report-actions{display:none !important}
    #report{display:block !important}
    .sheet{border:0; border-radius:0}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}

    .rhead{padding:0 0 6px; border-bottom-width:2px}
    .rtitle{margin-top:8px}
    .rtitle .k{font-size:10px}
    .rtitle h2{font-size:18px; margin:3px 0 4px}
    .rtitle .verify{font-size:10px; line-height:1.3; max-width:none}
    .metarow{margin-top:6px; padding-top:6px; gap:20px}
    .meta .l{font-size:9.5px}
    .meta .v{font-size:12px}

    section{padding:6px 0}
    section + section{border-top-width:1px}
    .sh{font-size:11px; margin-bottom:6px}

    .hcell{padding:5px 13px}
    .hcell .hl{font-size:11px}
    .hcell .ba{font-size:11.5px; margin:3px 0 2px}
    .hcell .hbig{margin-top:2px}
    .hcell .hbig .pct{font-size:20px}
    .hcell .hbig .ar{font-size:15px}
    .hcell .verdict{font-size:11px; margin-top:2px}

    .metric{padding:2px 0}
    .mtop{margin-bottom:4px}
    .mname{font-size:12.5px}
    .mname .u{font-size:10.5px}
    .mbadge{font-size:11.5px; padding:2px 9px}
    .mnote{display:none}
    .track{height:11px}
    .bars{gap:3px 12px; grid-template-columns:50px 1fr 70px}
    .bl{font-size:10px}
    .bv{font-size:12px}

    .panel .pt{padding:5px 13px; font-size:10px}
    .dl div{padding:1.5px 0; font-size:12px}

    .rfoot{padding:6px 0 0; border-top-width:2px}
    .rfoot .prep{font-size:12px}
    .rfoot .fl{font-size:10px; line-height:1.4}

    .metric,.hcell,.panel,.rhead,.hero{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- UPLOADER -->
  <div class="tool" id="tool">
    <h1>System Performance Verification</h1>
    <p>Upload the before and after TrueFlow reports. Data is read on this device — nothing is uploaded anywhere.</p>
    <div class="drops">
      <label class="drop" id="d1">
        <div class="tag">Before / Test-in report</div>
        <div class="fn" id="fn1">Tap to choose PDF</div>
        <input type="file" accept="application/pdf" hidden id="f1">
      </label>
      <label class="drop" id="d2">
        <div class="tag">After / Upgrade report</div>
        <div class="fn" id="fn2">Tap to choose PDF</div>
        <input type="file" accept="application/pdf" hidden id="f2">
      </label>
    </div>
    <div class="fields">
      <div><label>Client name (optional)</label><input id="cName" placeholder="e.g. Todd Brown"></div>
      <div><label>Service address (optional)</label><input id="cAddr" placeholder="Street, city"></div>
    </div>
    <div class="row-actions">
      <button class="btn btn-p" id="gen" disabled>Generate report</button>
      <span class="hint" id="status">Waiting for two reports.</span>
    </div>
  </div>

  <!-- REPORT -->
  <div id="report">
    <div class="sheet" id="sheet"></div>
    <div class="report-actions">
      <button class="btn btn-p" onclick="window.print()">Print / Save as PDF</button>
      <button class="btn btn-s" onclick="location.reload()">New comparison</button>
    </div>
  </div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const parsed = {1:null, 2:null};

const METRICS = [
  {key:'totalFlow',    name:'Total Airflow',                    unit:'SCFM',       dir:'up',   dp:0},
  {key:'tesp',         name:'Total External Static Pressure',   unit:'in H₂O',     dir:'down', dp:3},
  {key:'returnPlenum', name:'Return Plenum',                    unit:'in H₂O',     dir:'down', dp:3},
  {key:'filterDrop',   name:'Filter Drop',                      unit:'in H₂O',     dir:'down', dp:3},
  {key:'supplyPlenum', name:'Supply Plenum',                    unit:'in H₂O',     dir:'down', dp:3, upOk:true},
];

const rx = (t, re) => { const m = t.match(re); return m ? m[1].trim() : null; };
const firstRx = (t, arr) => { for (const re of arr){ const m = t.match(re); if (m) return m[1].trim(); } return null; };
const numOr = (v) => v==null ? null : parseFloat(String(v).replace(/,/g,''));
const tight = (v) => v ? v.replace(/\s+/g,'') : null;

async function readPDF(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let t = '';
  for (let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const c = await page.getTextContent();
    t += ' ' + c.items.map(o=>o.str).join(' ');
  }
  return t.replace(/\s+/g,' ').trim();
}

function extract(t){
  return {
    date:         rx(t, /Date tested:?\s*(\d{4}-\d{2}-\d{2})/i),
    totalFlow:    numOr(rx(t, /([\d,.]+)\s*SCFM(?!\s*\/)/i)),
    returnDuct:   numOr(rx(t, /Return duct\s*=\s*(-?[\d.]+)/i)),
    afterFilter:  numOr(rx(t, /After fi\s?lter\s*=\s*(-?[\d,.]+)/i)),
    supplyDuct:   numOr(rx(t, /Supply duct\s*=\s*(-?[\d.]+)/i)),
    tesp:         numOr(rx(t, /TESP\s+([\d.]+)/i)),
    returnPlenum: numOr(rx(t, /Return Plenum\s+([\d.]+)/i)),
    filterDrop:   numOr(rx(t, /Filter Drop\s+([\d.]+)/i)),
    supplyPlenum: numOr(rx(t, /Supply Plenum\s+([\d.]+)/i)),
    sysMode:      rx(t, /System Mode:\s*([A-Za-z]+)/i),
    climate:      rx(t, /Cooling Climate:\s*([A-Za-z]+)/i),
    elevation:    rx(t, /Elevation:\s*([\d.]+\s*ft)/i),
    returnTemp:   rx(t, /Return temp:\s*([\d.]+)\s*.?\s*F/i),
    sysType:      rx(t, /System Type:\s*([A-Za-z]+)/i),
    orientation:  tight(firstRx(t, [/Orientation:\s*([A-Za-z ]+?)\s*Cooling Capacity/i, /Orientation:\s*([A-Za-z]+)/i])),
    coolCap:      rx(t, /Cooling Capacity:\s*([\d.]+)/i),
    filterLoc:    rx(t, /Filter Location:\s*([A-Za-z]+)/i),
    company:      rx(t, /Company info\s*Name:\s*([^]*?)\s*Phone:/i),
    phone:        rx(t, /Phone:\s*([\d]+)/i),
    email:        tight(rx(t, /Email:\s*([A-Za-z0-9._ ]+@[A-Za-z0-9.\-]+)/i)),
    tech:         rx(t, /Tech info\s*Name:\s*([A-Za-z .'-]+?)\s*ID:/i),
  };
}

function slotSet(n){
  const drop = document.getElementById('d'+n);
  const fn = document.getElementById('fn'+n);
  const d = parsed[n];
  if (!d){ return; }
  if (d.totalFlow==null && d.tesp==null){
    drop.classList.add('err'); drop.classList.remove('set');
    fn.innerHTML = '<b>Couldn\'t read this PDF.</b> Is it a TrueFlow report?';
  } else {
    drop.classList.add('set'); drop.classList.remove('err');
    fn.innerHTML = '<b>'+(d.fileName||'PDF loaded')+'</b>' + (d.date?' · '+d.date:'');
  }
  const both = parsed[1] && parsed[2];
  document.getElementById('gen').disabled = !both;
  const s = document.getElementById('status');
  s.classList.remove('bad');
  s.textContent = both ? 'Ready. Reports will be ordered by test date.' :
                  'Waiting for '+(!parsed[1]&&!parsed[2]?'two reports':'one more report')+'.';
}

[1,2].forEach(n=>{
  const inp = document.getElementById('f'+n);
  inp.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    document.getElementById('fn'+n).textContent = 'Reading…';
    try{
      const text = await readPDF(file);
      const data = extract(text); data.fileName = file.name;
      parsed[n] = data;
    }catch(err){
      parsed[n] = {fileName:file.name, _fail:true};
      console.error(err);
    }
    slotSet(n);
  });
});

document.getElementById('gen').addEventListener('click', ()=>{
  let a = parsed[1], b = parsed[2];
  // order by date: earlier = before
  if (a.date && b.date && a.date > b.date){ [a,b] = [b,a]; }
  buildReport(a, b);
  document.getElementById('report').style.display = 'block';
  document.getElementById('tool').scrollIntoView({behavior:'instant'});
  document.getElementById('report').scrollIntoView({behavior:'smooth'});
});

const fmt = (v,dp)=> v==null ? '—' : Number(v).toLocaleString('en-CA',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const esc = s => (s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function statusOf(m, before, after){
  if (before==null || after==null) return {cls:'', arrow:'', pct:null, dir:0};
  const d = after - before;
  const pct = before!==0 ? (d/before*100) : 0;
  const arrow = d>0?'↑':(d<0?'↓':'→');
  let cls;
  const improved = (m.dir==='up' && d>0) || (m.dir==='down' && d<0);
  if (Math.abs(d)<1e-9) cls='';
  else if (improved) cls='g';
  else if (m.upOk && m.dir==='down' && d>0) cls='w';
  else cls='b';
  return {cls, arrow, pct, dir:Math.sign(d), d};
}

function railFor(m, before, after){
  const st = statusOf(m, before, after);
  const max = Math.max(before||0, after||0) || 1;
  const wB = ((before||0)/max*100).toFixed(1);
  const wA = ((after||0)/max*100).toFixed(1);
  const badge = st.pct==null ? '' :
    `<span class="mbadge ${st.cls}">${st.arrow} ${Math.abs(st.pct).toFixed(1)}%</span>`;
  let note = '';
  if (st.cls==='g') note = `Improved — ${m.dir==='up'?'higher is better here':'lower is better here'}.`;
  else if (st.cls==='w') note = `Rose with the higher airflow. Expected when total flow increases; within acceptable range.`;
  else if (st.cls==='b') note = `Moved the wrong direction — worth a look.`;
  return `
    <div class="metric">
      <div class="mtop">
        <div class="mname">${m.name}<span class="u">${m.unit}</span></div>
        ${badge}
      </div>
      <div class="bars">
        <div class="bl">Before</div>
        <div class="track"><div class="fill base" style="width:${wB}%"></div></div>
        <div class="bv">${fmt(before,m.dp)}</div>
        <div class="bl">After</div>
        <div class="track"><div class="fill ${st.cls||'base'}" style="width:${wA}%"></div></div>
        <div class="bv">${fmt(after,m.dp)}</div>
      </div>
      ${note?`<div class="mnote">${note}</div>`:''}
    </div>`;
}

function heroCell(m, before, after){
  const st = statusOf(m, before, after);
  const verdict = st.cls==='g'?'Improved':(st.cls==='w'?'Acceptable':(st.cls==='b'?'Review':'No change'));
  return `
    <div class="hcell ${st.cls}">
      <div class="hl">${m.name}</div>
      <div class="ba"><b>${fmt(before,m.dp)}</b> → <b>${fmt(after,m.dp)}</b> ${m.unit}</div>
      <div class="hbig"><span class="ar">${st.arrow}</span><span class="pct">${st.pct==null?'—':Math.abs(st.pct).toFixed(0)+'%'}</span></div>
      <div class="verdict">${verdict}</div>
    </div>`;
}

const condRows = d => [
  ['System mode', d.sysMode], ['System type', d.sysType],
  ['Orientation', d.orientation], ['Cooling capacity', d.coolCap?d.coolCap+' ton':null],
  ['Climate', d.climate], ['Elevation', d.elevation],
  ['Return temp', d.returnTemp?d.returnTemp+'° F':null], ['Filter location', d.filterLoc],
].map(([k,v])=>`<div><span class="dk">${k}</span><span class="dv">${v??'—'}</span></div>`).join('');

const measRows = d => [
  ['Total airflow', d.totalFlow!=null?d.totalFlow+' SCFM':null],
  ['Return duct', d.returnDuct!=null?d.returnDuct+' in H₂O':null],
  ['After filter', d.afterFilter!=null?d.afterFilter+' in H₂O':null],
  ['Supply duct', d.supplyDuct!=null?d.supplyDuct+' in H₂O':null],
  ['Total external static', d.tesp!=null?d.tesp+' in H₂O':null],
].map(([k,v])=>`<div><span class="dk">${k}</span><span class="dv">${v??'—'}</span></div>`).join('');

function buildReport(before, after){
  const clientName = document.getElementById('cName').value.trim();
  const clientAddr = document.getElementById('cAddr').value.trim();
  const co = after.company || before.company || 'Homestar HVAC Solutions';

    .map(k=>{const m=METRICS.find(x=>x.key===k); return heroCell(m, before[k], after[k]);}).join('');
